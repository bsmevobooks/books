(r[4]), ph_(r[5])].filter(String), email: String(r[6] || '').trim() };\n  });\n}\nfunction orders_(){\n  var v = sh_('הזמנות', OR_HEAD).getDataRange().getValues(); v.shift();\n  return v.map(function(r, i){ return { row: i + 2, sid: String(r[0]), name: String(r[1]), cls: String(r[2]), phone: ph_(r[3]), books: String(r[4]).split(',').filter(String), titles: String(r[5]).split(' | '), total: Number(r[6]) || 0, pay: String(r[7]), status: String(r[9] || 'חדשה'), created: iso_(r[10]), updated: iso_(r[11]), email: String(r[12] || ''), note: String(r[13] || '') }; }).filter(function(o){ return o.sid; });\n}\nfunction pack_(C, grade){ var ids = [], tot = 0; (C.books || []).forEach(function(b){ if(!b.grades || !b.grades.length || b.grades.indexOf(grade) >= 0){ ids.push(b.id); tot += Number(b.price) || 0; } });\n  var pp = C.mode == 'pack' && C.packs && C.packs[grade] != null && C.packs[grade] !== '' ? Number(C.packs[grade]) : null;\n  return { ids: ids, total: pp != null && !isNaN(pp) ? pp : tot }; }\nfunction nq_(s){ return String(s == null ? '' : s).replace(/[\"'`\\u05f3\\u05f4]/g, '').replace(/\\s+/g, ' ').trim(); }\nfunction emOk_(e){ return /^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(String(e || '')); }\nfunction famEmail_(phone, all){ var f = (all || students_()).filter(function(s){ return s.phones.indexOf(phone) >= 0; }); return f.map(function(s){ return s.email; }).filter(String)[0] || ''; }\nfunction setEmail_(phone, em){\n  var s = sh_('תלמידות', ST_HEAD), v = s.getDataRange().getValues();\n  for(var i = 1; i \u003c v.length; i++){ if(ph_(v[i][4]) == phone || ph_(v[i][5]) == phone) s.getRange(i + 1, 7).setValue(em); }\n}\nfunction emailMap_(all){ var m = {}; all.forEach(function(x){ if(x.email) x.phones.forEach(function(p){ if(!m[p]) m[p] = x.email; }); }); return m; }\nfunction stRow_(r, em){ var ph = r.phones || [], e = r.email || (em && (em[ph[0]] || em[ph[1]])) || ''; return [r.id, r.name, r.cls, r.grade, ph[0] ? \"'\" + ph[0] : '', ph[1] ? \"'\" + ph[1] : '', e]; }\nfunction pub_(s){ return { id: s.id, name: s.name, cls: s.cls, grade: s.grade, ph: s.phones.map(function(p){ return p.slice(-3); }) }; }\nfunction family_(phone){ return students_().filter(function(s){ return s.phones.indexOf(phone) >= 0; }); }\nfunction mine_(fam){ var m = {}, ids = fam.map(function(s){ return s.id; }); orders_().forEach(function(o){ if(ids.indexOf(o.sid) >= 0) m[o.sid] = { books: o.books, total: o.total, pay: o.pay, status: o.status, created: o.created, updated: o.updated, note: o.note }; }); return m; }\nfunction sign_(s){ return Utilities.base64EncodeWebSafe(Utilities.computeHmacSha256Signature(s, KEY)).slice(0, 32); }\nfunction token_(phone){ var b = phone + '.' + (Date.now() + 45 * 864e5); return b + '.' + sign_(b); }\nfunction check_(t){ var p = String(t || '').split('.'); if(p.length != 3 || sign_(p[0] + '.' + p[1]) !== p[2] || Number(p[1]) \u003c Date.now()) return null; return p[0]; }\nfunction rate_(k, max){ var c = CacheService.getScriptCache(), key = 'rl_' + k + '_' + Math.floor(Date.now() / 600000), n = Number(c.get(key) || 0); if(n >= max) return false; c.put(key, String(n + 1), 700); return true; }\nfunction mask_(e){ var p = String(e).split('@'); return p[0].slice(0, 2) + '•••@' + (p[1] || ''); }\nfunction mail_(to, subject, body){ var C = cfg_(); MailApp.sendEmail(to, subject, body, { name: C.school || 'הזמנת ספרים' }); }\nvar SK_HEAD = ['מזהה ספר','שם הספר','הוזמן מהספק','הגיע','ספק','מחיר קנייה','הערה','עודכן'];\nvar RC_HEAD = ['תאריך','מזהה ספר','שם הספר','כמות','הערה'];\nfunction stock_(){\n  var v = sh_('מלאי', SK_HEAD).getDataRange().getValues(), m = {}; v.shift();\n  v.forEach(function(r){ if(r[0]) m[String(r[0])] = { ord: Number(r[2]) || 0, rec: Number(r[3]) || 0, sup: String(r[4] || ''), cost: Number(r[5]) || 0, note: String(r[6] || ''), upd: iso_(r[7]) }; });\n  var g = sh_('קבלות מלאי', RC_HEAD).getDataRange().getValues(); g.shift();\n  var log = g.slice(-60).reverse().map(function(r){ return { d: iso_(r[0]), id: String(r[1]), t: String(r[2]), n: Number(r[3]) || 0, note: String(r[4] || '') }; });\n  return { m: m, log: log };\n}\nfunction stockPut_(id, t, f){\n  var s = sh_('מלאי', SK_HEAD), v = s.getDataRange().getValues(), at = -1;\n  for(var i = 1; i \u003c v.length; i++){ if(String(v[i][0]) == String(id)){ at = i; break; } }\n  var cur = at > 0 ? v[at] : [id, t, 0, 0, '', 0, '', ''];\n  var row = [String(id), t || cur[1], f.ord != null ? Number(f.ord) || 0 : cur[2], f.rec != null ? Number(f.rec) || 0 : (Number(cur[3]) || 0) + (Number(f.add) || 0), f.sup != null ? String(f.sup) : cur[4], f.cost != null ? Number(f.cost) || 0 : cur[5], f.note != null ? String(f.note) : cur[6], new Date()];\n  if(at > 0) s.getRange(at + 1, 1, 1, SK_HEAD.length).setValues([row]); else s.appendRow(row);\n}\nvar Q_HEAD = ['אל','נושא','תוכן','נוסף','מצב','נשלח'];\nvar RESERVE = 20;\nfunction qStats_(){\n  var v = sh_('תור מיילים', Q_HEAD).getDataRange().getValues(), w = 0, sent = 0, bad = 0, d = today_();\n  for(var i = 1; i \u003c v.length; i++){ var st = String(v[i][4]); if(st == 'ממתין') w++; else if(st == 'נכשל') bad++; else if(st == 'נשלח' && v[i][5] && Utilities.formatDate(new Date(v[i][5]), 'Asia/Jerusalem', 'yyyy-MM-dd') == d) sent++; }\n  var q = MailApp.getRemainingDailyQuota(), P = PropertiesService.getScriptProperties(), mx = Math.max(Number(P.getProperty('MQ') || 0), q);\n  if(mx > Number(P.getProperty('MQ') || 0)) P.setProperty('MQ', String(mx));\n  var tr = false; try{ tr = ScriptApp.getProjectTriggers().some(function(t){ return t.getHandlerFunction() == 'runQueue'; }); }catch(x){}\n  return { waiting: w, sentToday: sent, failed: bad, quota: q, perDay: Math.max(1, (mx > 100 ? 1500 : 100) - RESERVE), auto: tr };\n}\nfunction flush_(sec){\n  var lock = LockService.getScriptLock(); if(!lock.tryLock(5000)) return 0;\n  var n = 0;\n  try{\n    var s = sh_('תור מיילים', Q_HEAD), v = s.getDataRange().getValues(), t0 = Date.now(), first = -1, last = -1;\n    for(var i = 1; i \u003c v.length; i++){\n      if(String(v[i][4]) != 'ממתין') continue;\n      if(Date.now() - t0 > sec * 1000) break;\n      if(MailApp.getRemainingDailyQuota() \u003c= RESERVE) break;\n      try{ mail_(String(v[i][0]), String(v[i][1]), String(v[i][2])); v[i][4] = 'נשלח'; n++; }catch(x){ v[i][4] = 'נכשל'; }\n      v[i][5] = new Date(); if(first \u003c 0) first = i; last = i;\n    }\n    if(first > 0) s.getRange(first + 1, 5, last - first + 1, 2).setValues(v.slice(first, last + 1).map(function(r){ return [r[4], r[5]]; }));\n  } finally { lock.releaseLock(); }\n  return n;\n}\nfunction runQueue(){ flush_(270); }\nfunction setup(){\n  ScriptApp.getProjectTriggers().forEach(function(t){ if(t.getHandlerFunction() == 'runQueue') ScriptApp.deleteTrigger(t); });\n  ScriptApp.newTrigger('runQueue').timeBased().everyHours(1).create();\n  sh_('תור מיילים', Q_HEAD);\n  Logger.log('מוכן ✓ התור יישלח אוטומטית כל שעה. נותרו היום ' + MailApp.getRemainingDailyQuota() + ' מיילים.');\n}\nfunction doGet(e){ return out_({ ok: true, ver: VER, msg: 'השרת של מערכת הזמנת הספרים פועל ✓' }); }\nfunction doPost(e){\n  var lock = null;\n  try{\n    var q = JSON.parse(e.postData.contents), a = q.a, C = cfg_();\n    if(a == 'find'){\n      var qq = nq_(q.q); if(qq.length \u003c 2) return out_({ ok: true, students: [], ver: VER });\n      if(!rate_('find', 900)) return out_({ ok: false, err: 'יותר מדי חיפושים כרגע. נסו שוב בעוד כמה דקות.' });\n      var W = qq.split(' ');\n      var all = students_();\n      var r = all.filter(function(s){ var n = nq_(s.name); return W.every(function(w){ return n.indexOf(w) >= 0; }); }).slice(0, 8).map(function(s){\n        var o = pub_(s); o.em = s.phones.map(function(x){ var e = famEmail_(x, all); return e ? mask_(e) : ''; }); return o; });\n      return out_({ ok: true, students: r, ver: VER });\n    }\n    if(a == 'check'){\n      var phone = ph_(q.phone); if(phone.length \u003c 9) return out_({ ok: false, err: 'מספר הטלפון לא תקין' });\n      if(!rate_('c' + phone, 20)) retu לשלוח לכם במייל עדכונים על ההזמנה בלבד: קוד אימות, אישור הזמנה, תזכורות תשלום והודעה כשהספרים מגיעים. לא נשלח פרסומות, ולא נשתמש במידע לשום מטרה אחרת.\n\n## האם חובה למסור את המידע\nאין חובה חוקית למסור את כתובת המייל. בלי מייל אי אפשר לשלוח קוד אימות ולכן גם אי אפשר להזמין דרך האתר – אפשר להזמין דרך מזכירות בית הספר.\n\n## איפה המידע נשמר ומי רואה אותו\n• המידע נשמר בגיליון Google של בית הספר, ומשם נשלחים המיילים (שירותי Google).\n• דפי האתר עצמם מאוחסנים ב-GitHub, ואין בהם מידע אישי.\n• רק צוות בית הספר שמטפל בהזמנות רואה את המידע. ספק הספרים מקבל רק כמויות – בלי שמות ופרטי קשר.\n• לא נמכור ולא נעביר את המידע לאף גורם אחר, אלא אם נידרש לכך על פי דין.\n\n## כמה זמן נשמור את המידע\nעד סוף שנת הלימודים, ועד שתסתיים הגבייה וכל עניין שקשור להזמנה. אחר כך המידע יימחק.\n\n## אבטחת מידע\nהכניסה לאזור האישי מחייבת קוד אימות חד-פעמי למייל. מספרי הטלפון מוצגים באתר רק בחלקם. הגישה לניהול מוגבלת לצוות בית הספר.\n\n## מה נשמר במכשיר שלכם\nאחרי האימות נשמר בדפדפן שלכם אישור כניסה (עד 45 יום), כדי שלא תצטרכו קוד בכל ביקור. אפשר למחוק אותו בכל רגע בלחיצה על \"יציאה מהמכשיר הזה\" באזור האישי. האתר לא משתמש בעוגיות (cookies) של פרסום או של מעקב. הגופנים באתר נטענים משירות Google Fonts.\n\n## הזכויות שלכם\nלפי חוק הגנת הפרטיות, התשמ\"א-1981, אתם רשאים לעיין במידע עליכם, ולבקש לתקן אותו או למחוק אותו. את כתובת המייל ואת ההזמנה אפשר לשנות לבד באזור האישי. לכל בקשה אחרת פונים אלינו: {פרטי_קשר}.`,\naccess:`עודכן לאחרונה: {תאריך_עדכון}\n\n{בית_ספר} רואה חשיבות רבה בכך שכל ההורים יוכלו להזמין ספרים בקלות ובעצמם, גם הורים עם מוגבלות. השקענו מאמצים כדי שהאתר יהיה נגיש, לפי תקנה 35 לתקנות שוויון זכויות לאנשים עם מוגבלות (התאמות נגישות לשירות), התשע\"ג-2013, ולפי התקן הישראלי ת\"י 5568 ברמה AA (המבוסס על הנחיות WCAG 2.0).\n\n## מה עשינו באתר\n• אפשר לעבור על כל האתר עם המקלדת בלבד (Tab, Enter, רווח, Esc), והמקום שבו נמצאים מסומן במסגרת בולטת.\n• קישור \"דילוג לתוכן\" בתחילת כל דף.\n• מבנה כותרות מסודר, ותיאור לכל כפתור ושדה עבור קוראי מסך.\n• הודעות שגיאה מוקראות אוטומטית ומסבירות מה לתקן.\n• ניגודיות צבעים מספקת, וטקסט שאפשר להגדיל עד 200% בלי שהאתר יישבר.\n• האתר מותאם לטלפון, לטאבלט ולמחשב.\n• תפריט נגישות (הכפתור ♿ למעלה): הגדלת טקסט, ניגודיות גבוהה, הדגשת קישורים, גופן קריא ועצירת אנימציות.\n• אם במכשיר מוגדר \"הפחתת תנועה\" – האנימציות באתר נעצרות לבד.\n\n## מה עוד לא מושלם\nלמרות המאמצים, ייתכן שחלק מהדפים או מהתכנים עדיין לא נגישים במלואם – למשל באנרים עם תמונה שהועלו לאתר, או דף תשלום באשראי של חברת הסליקה (שאינו בשליטת בית הספר). אם נתקלתם בקושי – נשמח שתספרו לנו, ונטפל בזה במהירות. אפשר תמיד להזמין גם דרך מזכירות בית הספר.\n\n## האתר נבדק בדפדפנים\nChrome, Edge, Firefox ו-Safari, במחשב ובטלפון.\n\n## רכז/ת הנגישות\n{רכז_נגישות}`,\nterms:`עודכן לאחרונה: {תאריך_עדכון}\n\n## כללי\nהאתר משמש את הורי התלמידות של {בית_ספר} להזמנת ספרי לימוד. השימוש באתר מהווה הסכמה לתנאים האלה ול[מדיניות הפרטיות].\n\n## ההזמנה\n• אפשר להזמין, לשנות ולבטל את ההזמנה באזור האישי עד התאריך האחרון שנקבע באתר ({תאריך_אחרון}). אחרי התאריך – לשינויים פונים למזכירות.\n• מחירי הספרים מופיעים באתר, והם הקובעים. אם נפלה טעות במחיר – בית הספר יעדכן אתכם לפני הגבייה.\n• הזמנה שכבר שולמה או שהספרים שלה כבר נמסרו – אפשר לבטל רק דרך המזכירות.\n• בית הספר יעשה כל מאמץ שהספרים יגיעו בזמן, אבל אינו אחראי לעיכובים אצל הספקים.\n\n## תשלום\nהתשלום נעשה באמצעי שבחרתם: הוראת קבע, אשראי, או מזומן / צ׳ק במזכירות. על הגבייה תקבלו עדכון במייל.\n\n## אחריות על הפרטים\nאתם אחראים שהפרטים שמסרתם – ובמיוחד כתובת המייל – נכונים ושייכים לכם. אין למסור קוד אימות לאדם אחר.\n\n## יצירת קשר\n{פרטי_קשר}`};\nconst LEGAL_T={privacy:'מדיניות פרטיות',access:'הצהרת נגישות',terms:'תנאי שימוש'};\nfunction legalVars(){const L=D.legal||{},c=[D.set.phone?'טלפון '+D.set.phone:'',D.set.email?'מייל '+D.set.email:''].filter(Boolean).join(' · ')||'מזכירות בית הספר';\n const co=L.coord?[L.coord,L.cphone?'טלפון: '+L.cphone:'',L.cemail?'מייל: '+L.cemail:''].filter(Boolean).join('\\n'):'לפניות בנושא נגישות: '+c;\n return{'בית_ספר':L.owner||D.brand||'בית הספר','פרטי_קשר':c,'רכז_נגישות':co,'תאריך_עדכון':L.updated?dmy(L.updat
