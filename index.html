<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הזמנת ספרים | בית הספר</title>
<meta name="description" content="מערכת הזמנת ספרים לתלמידות בית הספר – בוחרים, מאשרים ומשלמים בכמה לחיצות.">
<meta property="og:title" content="הזמנת ספרים | בית הספר">
<meta property="og:description" content="מערכת הזמנת ספרים לתלמידות בית הספר – בוחרים, מאשרים ומשלמים בכמה לחיצות.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#24305e">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%2324305e%22/%3E%3Crect x=%2216%22 y=%2214%22 width=%229%22 height=%2236%22 rx=%222%22 fill=%22%23f4a72c%22/%3E%3Crect x=%2228%22 y=%2219%22 width=%229%22 height=%2231%22 rx=%222%22 fill=%22%23e5735c%22/%3E%3Crect x=%2240%22 y=%2216%22 width=%229%22 height=%2234%22 rx=%222%22 fill=%22%23fbf6ec%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" id="bk-fonts" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&family=Secular+One&display=swap">
<style>
  :root{
    --ink:#24305e; --ink-soft:#5b6283; --cream:#fbf6ec; --paper:#f3ead8; --card:#fff;
    --sun:#f4a72c; --sun-deep:#d98a0b; --rose:#e5735c; --rose-deep:#b9503b; --leaf:#2f8f7b; --sky:#5a7fd8; --wood:#c9925a;
    --fh:'Secular One',sans-serif; --fb:'Rubik',sans-serif;
    --line:rgba(36,48,94,.12); --shadow:0 24px 50px -28px rgba(36,48,94,.45); --r:26px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--fb);font-size:17px;line-height:1.6;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 500px at 105% -10%,rgba(244,167,44,.18),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(90,127,216,.12),transparent 60%)}
  h1,h2,h3,h4{font-family:var(--fh);font-weight:var(--fhw,400);margin:0;line-height:1.2}
  button{font-family:inherit}
  a{color:inherit}
  .wrap{max-width:1120px;margin:0 auto;padding:0 22px;width:100%}
  ::selection{background:var(--sun);color:var(--ink)}
  :focus-visible{outline:3px solid var(--sun);outline-offset:3px}
  .skip{position:fixed;top:10px;right:10px;z-index:999;background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;transform:translateY(-200%);transition:transform .2s}
  .skip:focus{transform:none}
  .hl{color:var(--rose)}

  /* top bar */
  .top{position:sticky;top:0;z-index:40;background:rgba(251,246,236,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top-in{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 22px;max-width:1120px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:11px;text-decoration:none;cursor:pointer;background:none;border:0;color:inherit;padding:0;text-align:right}
  .brand-ic{width:40px;height:40px;border-radius:12px;background:var(--ink);display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:0 0 8px;flex:none}
  .brand-ic i{display:block;width:6px;border-radius:2px}
  .brand b{font-family:var(--fh);font-weight:var(--fhw,400);font-size:21px;display:block;line-height:1.1}
  .brand small{display:block;font-size:13px;color:var(--ink-soft)}
  .top-act{display:flex;gap:8px;align-items:center}
  .pill{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-weight:600;font-size:15px;cursor:pointer;transition:transform .2s,background .2s}
  .pill:hover{transform:translateY(-2px);background:#1a2348}
  .pill.ghost{background:rgba(36,48,94,.07);color:var(--ink)}
  .pill.ghost:hover{background:rgba(36,48,94,.13)}
  @media(max-width:560px){.brand small{display:none}.pill{padding:9px 14px;font-size:14px}}

  /* stepper */
  .steps{display:none;max-width:860px;margin:26px auto 0;padding:0 22px}
  .steps.on{display:block}
  .steps ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);position:relative}
  .steps li{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);position:relative;text-align:center}
  .steps li::before{content:"";position:absolute;top:14px;right:50%;width:100%;height:3px;background:var(--line);z-index:0}
  .steps li:first-child::before{display:none}
  .steps li i{width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:13px;position:relative;z-index:1;transition:all .3s}
  .steps li.ok::before,.steps li.now::before{background:var(--sun)}
  .steps li.ok i{background:var(--sun);border-color:var(--sun);color:var(--ink)}
  .steps li.now i{background:var(--ink);border-color:var(--sun);color:#fff;box-shadow:0 0 0 5px rgba(244,167,44,.25)}
  .steps li.now{color:var(--ink);font-weight:700}
  @media(max-width:560px){.steps li span{display:none}.steps li.now span{display:block;position:absolute;top:36px;white-space:nowrap}.steps{margin-bottom:18px}}

  main{flex:1}
  #stage{padding:26px 0 70px}
  #stage.in>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
  #stage.in>*:nth-child(2){animation-delay:.06s}#stage.in>*:nth-child(3){animation-delay:.12s}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}}

  /* hero */
  .hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:30px 0 10px}
  @media(max-width:880px){.hero{grid-template-columns:1fr;gap:10px;text-align:center}.hero-art{order:-1;max-width:330px;margin:0 auto}}
  .kicker{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;color:var(--ink-soft)}
  .kicker::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sun)}
  .hero h1{font-size:clamp(42px,6.4vw,74px);margin:18px 0 14px;line-height:1.05}
  .hero .lead{font-size:20px;color:var(--ink-soft);max-width:46ch;margin:0 0 28px}
  @media(max-width:880px){.hero .lead{margin-inline:auto}}
  .cta{position:relative;display:inline-flex;align-items:center;gap:20px;border:0;cursor:pointer;background:var(--ink);color:#fff;border-radius:28px;padding:22px 30px 22px 22px;text-align:right;box-shadow:0 26px 50px -22px rgba(36,48,94,.8);transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s;overflow:hidden;isolation:isolate}
  .cta::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.14) 50%,transparent 70%);transform:translateX(100%);animation:shine 3.6s ease-in-out infinite}
  @keyframes shine{0%,60%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
  .cta:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 32px 60px -22px rgba(36,48,94,.9)}
  .cta b{display:block;font-family:var(--fh);font-weight:var(--fhw,400);font-size:clamp(25px,3.2vw,32px);line-height:1.15}
  .cta small{display:block;font-size:16px;color:var(--sun);font-weight:600;margin-top:2px}
  .cta .arr{flex:none;width:56px;height:56px;border-radius:50%;background:var(--sun);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;transition:transform .3s}
  .cta:hover .arr{transform:translateX(-6px)}
  .cta.alt{background:var(--leaf);box-shadow:0 26px 50px -22px rgba(47,143,123,.8)}
  .cta.alt small{color:#d7fff4}
  .cta.alt .arr{background:#fff}
  .cta-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  @media(max-width:880px){.cta-row{justify-content:center}}
  .link-btn{background:none;border:0;cursor:pointer;color:var(--ink);font-weight:600;font-size:16px;border-bottom:2px solid var(--sun);padding:2px 0}
  .dl{margin:22px 0 0;font-size:15.5px;color:var(--ink-soft)}
  .dl b{color:var(--ink)}
  .dl .cnt{display:inline-block;background:rgba(244,167,44,.2);color:#8a5600;font-weight:700;border-radius:999px;padding:2px 11px;margin-inline-start:6px}
  .hero-art svg{width:100%;height:auto;overflow:visible}
  .hero-art .bk{animation:pop .7s cubic-bezier(.3,1.5,.5,1) both;animation-delay:var(--d);transform-origin:50% 100%;transform-box:fill-box}
  @keyframes pop{from{transform:scaleY(0)}}
  .hero-art .lt{font-family:var(--fh);fill:var(--ink);opacity:.85;animation:bob 5s ease-in-out infinite;animation-delay:var(--d)}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  .how{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:56px}
  @media(max-width:880px){.how{grid-template-columns:1fr 1fr}}
  .how div{background:#fff;border-radius:22px;padding:22px 20px;box-shadow:0 1px 0 var(--line)}
  .how i{display:flex;width:42px;height:42px;border-radius:14px;background:var(--paper);align-items:center;justify-content:center;font-style:normal;font-size:22px;margin-bottom:10px;transform:rotate(-6deg)}
  .how b{display:block;font-family:var(--fh);font-weight:var(--fhw,400);font-size:18px;margin-bottom:2px}
  .how span{font-size:14.5px;color:var(--ink-soft)}
  .notice{background:#fff;border-radius:22px;padding:20px 22px;box-shadow:0 1px 0 var(--line);margin-top:20px;display:flex;gap:14px;align-items:flex-start;text-align:right}
  .notice.warn{background:#fff6ea;box-shadow:inset 0 0 0 2px rgba(244,167,44,.4)}

  /* screens */
  .scr-head{text-align:center;max-width:640px;margin:0 auto 26px}
  .scr-head h2{font-size:clamp(30px,4.2vw,42px)}
  .scr-head p{color:var(--ink-soft);margin:10px 0 0;font-size:17.5px}
  .box{background:var(--card);border-radius:var(--r);padding:26px;box-shadow:0 1px 0 var(--line),var(--shadow)}
  .box h3{font-size:21px;display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .n{width:32px;height:32px;border-radius:11px;background:var(--ink);color:var(--sun);display:inline-flex;align-items:center;justify-content:center;font-family:var(--fb);font-weight:700;font-size:16px;transform:rotate(-6deg);flex:none}
  .idgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:start}
  @media(max-width:820px){.idgrid{grid-template-columns:1fr}}
  .srch{display:flex;gap:8px;margin-bottom:12px}
  .srch input,.srch select,.fld input,.fld select,.fld textarea{font-family:inherit;font-size:16.5px;color:var(--ink);background:var(--cream);border:2px solid transparent;border-radius:14px;padding:12px 14px;transition:border-color .2s,background .2s;width:100%}
  .srch input:focus,.srch select:focus,.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--sun);background:#fff}
  .srch select{width:auto;flex:none}
  .slist{height:360px;overflow:auto;border-radius:16px;background:var(--cream);padding:6px;scroll-behavior:smooth}
  .slist .grp{position:sticky;top:-6px;background:var(--cream);font-weight:700;font-size:13px;color:var(--ink-soft);padding:8px 10px 4px;z-index:1}
  .sit{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;border:0;background:transparent;border-radius:12px;padding:11px 12px;font-size:16.5px;cursor:pointer;text-align:right;color:var(--ink);transition:background .15s}
  .sit:hover{background:#fff}
  .sit small{color:var(--ink-soft);font-size:13.5px}
  .sit.on{background:var(--ink);color:#fff}
  .sit.on small{color:var(--sun)}
  .sit.on::after{content:"✓";font-weight:800;color:var(--sun)}
  .sit mark{background:rgba(244,167,44,.4);color:inherit;border-radius:3px}
  .empty{text-align:center;color:var(--ink-soft);padding:30px 10px;font-size:15px}
  .picked{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:16px;padding:14px 16px;margin-bottom:16px;min-height:62px;font-size:15.5px;color:var(--ink-soft)}
  .picked.ok{background:#eef7f4;color:var(--ink)}
  .picked .av{flex:none;width:36px;height:36px;border-radius:12px;background:var(--leaf);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
  .picked b{font-size:17px}
  .phh{margin-top:4px;font-size:14.5px;color:var(--ink)}
  .phh b{font-size:15.5px;letter-spacing:.04em;background:#fff;border-radius:8px;padding:1px 7px;white-space:nowrap}
  .fl{position:relative;display:block;margin-bottom:14px}
  .fl input{width:100%;font-family:inherit;font-size:20px;letter-spacing:.04em;color:var(--ink);background:var(--cream);border:2px solid transparent;border-radius:16px;padding:26px 16px 9px;transition:border-color .2s,background .2s;text-align:right}
  .fl span{position:absolute;right:17px;top:19px;font-size:16px;color:var(--ink-soft);pointer-events:none;transition:all .18s;letter-spacing:0}
  .fl input:focus{outline:none;border-color:var(--sun);background:#fff}
  .fl input:focus+span,.fl input:not(:placeholder-shown)+span{top:7px;font-size:12.5px;font-weight:700;color:var(--sun-deep)}
  .bad{border-color:var(--rose)!important;background:#fff5f2!important}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
  .seg label{cursor:pointer;position:relative}
  .seg input{position:absolute;opacity:0}
  .seg span{display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line);border-radius:14px;padding:11px;font-weight:600;font-size:15px;transition:all .2s;background:#fff}
  .seg input:checked+span{border-color:var(--sun);background:#fff8ea}
  .seg input:focus-visible+span{outline:3px solid var(--sun);outline-offset:2px}
  .seg svg{width:20px;height:20px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;border-radius:999px;padding:15px 28px;font-weight:700;font-size:17px;transition:transform .2s,box-shadow .2s,background .2s;text-decoration:none}
  .btn:disabled{opacity:.6;cursor:wait;transform:none!important}
  .btn.pri{background:var(--ink);color:#fff;box-shadow:0 14px 28px -14px rgba(36,48,94,.8)}
  .btn.pri:hover{transform:translateY(-2px);background:#1a2348}
  .btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 14px 28px -14px rgba(217,138,11,.9)}
  .btn.sun:hover{transform:translateY(-2px)}
  .btn.soft{background:rgba(36,48,94,.07);color:var(--ink)}
  .btn.soft:hover{background:rgba(36,48,94,.13)}
  .btn.leaf{background:var(--leaf);color:#fff}
  .wide{width:100%}
  .err{color:var(--rose-deep);font-weight:600;font-size:15px;min-height:0;margin:10px 0 0}
  .err:empty{display:none}
  .demo{margin-top:16px;background:#f0f4ff;border-radius:14px;padding:12px 14px;font-size:14px;color:#33427a;line-height:1.55}
  .demo b{direction:ltr;unicode-bidi:embed}
  .back{display:inline-flex;align-items:center;gap:6px;margin-top:22px;background:none;border:0;cursor:pointer;color:var(--ink-soft);font-weight:600;font-size:15.5px;padding:6px 2px}
  .back:hover{color:var(--ink)}
  .center{text-align:center}

  /* find (identification) */
  .find-box{max-width:660px;margin:0 auto}
  .find-in{position:relative;display:block}
  .find-in input{width:100%;font-family:inherit;font-size:20px;color:var(--ink);background:var(--cream);border:2px solid transparent;border-radius:18px;padding:17px 52px 17px 18px;transition:border-color .2s,background .2s}
  .find-in input:focus{outline:none;border-color:var(--sun);background:#fff}
  .find-ic{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:20px;pointer-events:none}
  #fres:not(:empty){margin-top:14px}
  .fr-list{display:grid;gap:8px}
  .fr{border-radius:18px;background:var(--cream);overflow:hidden;transition:box-shadow .2s,background .2s}
  .fr.on{background:#fff;box-shadow:0 0 0 2px var(--sun)}
  .fr-h{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;cursor:pointer;text-align:right;padding:12px 14px;color:var(--ink);font-family:inherit}
  .fr-h:hover{background:rgba(255,255,255,.7)}
  .fr-h .av{flex:none;width:40px;height:40px;border-radius:13px;background:var(--leaf);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:19px}
  .fr-t{flex:1;min-width:0}.fr-t b{display:block;font-size:17.5px;font-weight:600}.fr-t small{color:var(--ink-soft);font-size:14px}
  .fr-t mark{background:rgba(244,167,44,.4);color:inherit;border-radius:3px}
  .fr-p{flex:none;font-size:14px;color:var(--ink-soft);letter-spacing:.04em;display:flex;gap:8px}
  .fr-b{padding:4px 16px 16px}
  .fr-one{font-size:16px;margin:2px 0 12px}
  .fr-one b,.fr-phs b{font-size:17px;letter-spacing:.05em;background:var(--cream);border-radius:8px;padding:2px 8px;white-space:nowrap}
  .fr-q{font-weight:600;font-size:15px;margin-bottom:8px}
  .fr-phs{display:grid;gap:8px;margin-bottom:12px}
  .fr-phs label{cursor:pointer}.fr-phs input{position:absolute;opacity:0}
  .fr-phs span{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:14px;padding:10px 14px;transition:all .2s}
  .fr-phs input:checked+span{border-color:var(--sun);background:#fff8ea}
  .fr-phs input:focus-visible+span{outline:3px solid var(--sun);outline-offset:2px}
  .fr-note{display:block;text-align:center;color:var(--ink-soft);font-size:13.5px;margin-top:8px}
  .fr-phone{background:#fff}
  .fr-ph{padding:14px 16px 4px;font-size:15px}.fr-ph b{font-size:21px;letter-spacing:.05em}
  .fr-link{display:block;margin:10px auto 0;background:none;border:0;color:var(--ink-soft);font:600 14.5px var(--fb);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .fr-link:hover{color:var(--ink)}
  .fr-first{font-weight:700;font-size:15.5px;margin:2px 0 12px;color:var(--ink)}
  .fr-b .fl input{font-size:18px}
  .cf{background:var(--cream);border-radius:16px;padding:14px 16px;text-align:center;font-size:15.5px;color:var(--ink-soft);margin-bottom:12px}
  .cf-em{font-size:22px;font-weight:700;color:var(--ink);margin:6px 0 8px;word-break:break-all}
  .cf-ck{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15.5px;margin:0 0 14px;padding:10px 12px;border-radius:12px;border:2px solid transparent}
  .cf-ck.bad{border-color:var(--rose);background:#fff5f2}
  .cf-ck input{width:22px;height:22px;flex:none;accent-color:var(--ink);margin-top:1px}
  /* otp */
  .otp-box{max-width:520px;margin:0 auto;text-align:center}
  .otp{display:flex;gap:10px;justify-content:center;direction:ltr;margin:6px 0 18px}
  .otp input{width:54px;height:66px;border-radius:16px;border:2px solid var(--line);background:#fff;text-align:center;font-size:30px;font-weight:700;color:var(--ink);font-family:var(--fb);transition:border-color .2s,transform .2s}
  .otp input:focus{outline:none;border-color:var(--sun);transform:translateY(-2px)}
  .otp.shake{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
  @media(max-width:420px){.otp{gap:6px}.otp input{width:44px;height:56px;font-size:24px}}
  .resend{font-size:15px;color:var(--ink-soft);margin-top:14px}
  .resend button{background:none;border:0;color:var(--ink);font-weight:700;cursor:pointer;text-decoration:underline;font-size:15px}
  .resend button:disabled{color:var(--ink-soft);text-decoration:none;cursor:default}

  /* kids */
  .kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;max-width:820px;margin:0 auto}
  .kid{position:relative;border:0;cursor:pointer;text-align:right;background:#fff;border-radius:24px;padding:22px;box-shadow:0 1px 0 var(--line),var(--shadow);transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s;color:var(--ink)}
  .kid:hover{transform:translateY(-5px)}
  .kid.pre{box-shadow:0 0 0 3px var(--sun),var(--shadow)}

  .bnr-x{border:0;background:rgba(255,255,255,.18);color:inherit;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px;flex:none;line-height:1}

  .bnr-top{position:relative;z-index:41;background:var(--bb);display:flex;align-items:center;gap:10px;padding:10px 16px}

## מי אחראי על המידע
אתר הזמנת הספרים מופעל על ידי {בית_ספר} ("בית הספר"), שהוא האחראי על המידע שנאסף בו. לכל שאלה או בקשה בנושא פרטיות: {פרטי_קשר}.

## איזה מידע יש לנו
• מבית הספר: שם התלמידה, הכיתה ומספרי הטלפון של ההורים – כפי שהם רשומים בבית הספר.
• ממכם: כתובת מייל שאתם מקלידים בכניסה הראשונה, והספרים ואמצעי התשלום שבחרתם.
• באתר לא נאספים פרטי כרטיס אשראי. אם בחרתם לשלם באשראי, התשלום נעשה בדף נפרד של חברת הסליקה, לפי תנאי השימוש והפרטיות שלה.

## למה המידע משמש
• לזהות אתכם בקוד אימות, כדי שרק ההורים יוכלו לצפות בהזמנה ולשנות אותה.
• לקלוט את ההזמנה, להכין את הספרים ולגבות את התשלום.
• לשלוח לכם במייל עדכונים על ההזמנה בלבד: קוד אימות, אישור הזמנה, תזכורות תשלום והודעה כשהספרים מגיעים. לא נשלח פרסומות, ולא נשתמש במידע לשום מטרה אחרת.

## האם חובה למסור את המידע
אין חובה חוקית למסור את כתובת המייל. בלי מייל אי אפשר לשלוח קוד אימות ולכן גם אי אפשר להזמין דרך האתר – אפשר להזמין דרך מזכירות בית הספר.

## איפה המידע נשמר ומי רואה אותו
• המידע נשמר בגיליון Google של בית הספר, ומשם נשלחים המיילים (שירותי Google).
• דפי האתר עצמם מאוחסנים ב-GitHub, ואין בהם מידע אישי.
• רק צוות בית הספר שמטפל בהזמנות רואה את המידע. ספק הספרים מקבל רק כמויות – בלי שמות ופרטי קשר.
• לא נמכור ולא נעביר את המידע לאף גורם אחר, אלא אם נידרש לכך על פי דין.

## כמה זמן נשמור את המידע
עד סוף שנת הלימודים, ועד שתסתיים הגבייה וכל עניין שקשור להזמנה. אחר כך המידע יימחק.

## אבטחת מידע
הכניסה לאזור האישי מחייבת קוד אימות חד-פעמי למייל. מספרי הטלפון מוצגים באתר רק בחלקם. הגישה לניהול מוגבלת לצוות בית הספר.

## מה נשמר במכשיר שלכם
אחרי האימות נשמר בדפדפן שלכם אישור כניסה (עד 45 יום), כדי שלא תצטרכו קוד בכל ביקור. אפשר למחוק אותו בכל רגע בלחיצה על "יציאה מהמכשיר הזה" באזור האישי. האתר לא משתמש בעוגיות (cookies) של פרסום או של מעקב. הגופנים באתר נטענים משירות Google Fonts.

## הזכויות שלכם
לפי חוק הגנת הפרטיות, התשמ"א-1981, אתם רשאים לעיין במידע עליכם, ולבקש לתקן אותו או למחוק אותו. את כתובת המייל ואת ההזמנה אפשר לשנות לבד באזור האישי. לכל בקשה אחרת פונים אלינו: {פרטי_קשר}.`,
access:`עודכן לאחרונה: {תאריך_עדכון}

{בית_ספר} רואה חשיבות רבה בכך שכל ההורים יוכלו להזמין ספרים בקלות ובעצמם, גם הורים עם מוגבלות. השקענו מאמצים כדי שהאתר יהיה נגיש, לפי תקנה 35 לתקנות שוויון זכויות לאנשים עם מוגבלות (התאמות נגישות לשירות), התשע"ג-2013, ולפי התקן הישראלי ת"י 5568 ברמה AA (המבוסס על הנחיות WCAG 2.0).

## מה עשינו באתר
• אפשר לעבור על כל האתר עם המקלדת בלבד (Tab, Enter, רווח, Esc), והמקום שבו נמצאים מסומן במסגרת בולטת.
• קישור "דילוג לתוכן" בתחילת כל דף.
• מבנה כותרות מסודר, ותיאור לכל כפתור ושדה עבור קוראי מסך.
• הודעות שגיאה מוקראות אוטומטית ומסבירות מה לתקן.
• ניגודיות צבעים מספקת, וטקסט שאפשר להגדיל עד 200% בלי שהאתר יישבר.
• האתר מותאם לטלפון, לטאבלט ולמחשב.
• תפריט נגישות (הכפתור ♿ למעלה): הגדלת טקסט, ניגודיות גבוהה, הדגשת קישורים, גופן קריא ועצירת אנימציות.
• אם במכשיר מוגדר "הפחתת תנועה" – האנימציות באתר נעצרות לבד.

## מה עוד לא מושלם
למרות המאמצים, ייתכן שחלק מהדפים או מהתכנים עדיין לא נגישים במלואם – למשל באנרים עם תמונה שהועלו לאתר, או דף תשלום באשראי של חברת הסליקה (שאינו בשליטת בית הספר). אם נתקלתם בקושי – נשמח שתספרו לנו, ונטפל בזה במהירות. אפשר תמיד להזמין גם דרך מזכירות בית הספר.

## האתר נבדק בדפדפנים
Chrome, Edge, Firefox ו-Safari, במחשב ובטלפון.

## כללי
האתר משמש את הורי התלמידות של {בית_ספר} להזמנת ספרי לימוד. השימוש באתר מהווה הסכמה לתנאים האלה ול[מדיניות הפרטיות].

## ההזמנה
• אפשר להזמין, לשנות ולבטל את ההזמנה באזור האישי עד התאריך האחרון שנקבע באתר ({תאריך_אחרון}). אחרי התאריך – לשינויים פונים למזכירות.
• מחירי הספרים מופיעים באתר, והם הקובעים. אם נפלה טעות במחיר – בית הספר יעדכן אתכם לפני הגבייה.
• הזמנה שכבר שולמה או שהספרים שלה כבר נמסרו – אפשר לבטל רק דרך המזכירות.
• בית הספר יעשה כל מאמץ שהספרים יגיעו בזמן, אבל אינו אחראי לעיכובים אצל הספקים.

## תשלום
התשלום נעשה באמצעי שבחרתם: הוראת קבע, אשראי, או מזומן / צ׳ק במזכירות. על הגבייה תקבלו עדכון במייל.

## אחריות על הפרטים
אתם אחראים שהפרטים שמסרתם – ובמיוחד כתובת המייל – נכונים ושייכים לכם. אין למסור קוד אימות לאדם אחר.

/* ---------- Shabbat & Yom Tov: ordering closes (Jerusalem times) ---------- */
function sunset(y,m,d){const R=Math.PI/180,lat=31.778,lon=35.235,N=Math.floor(275*m/9)-Math.floor((m+9)/12)*(1+Math.floor((y-4*Math.floor(y/4)+2)/3))+d-30,t=N+((18-lon/15)/24);
 const M=0.9856*t-3.289;let L=M+1.916*Math.sin(M*R)+0.020*Math.sin(2*M*R)+282.634;L=(L+360)%360;let RA=Math.atan(0.91764*Math.tan(L*R))/R;RA=(RA+360)%360;RA=(RA+Math.floor(L/90)*90-Math.floor(RA/90)*90)/15;
 const sd=0.39782*Math.sin(L*R),cd=Math.cos(Math.asin(sd)),ch=(Math.cos(90.833*R)-sd*Math.sin(lat*R))/(cd*Math.cos(lat*R));const H=Math.acos(ch)/R/15,UT=((H+RA-0.06571*t-6.622-lon/15)%24+24)%24;
 return Date.UTC(y,m-1,d)+UT*3600000}
const HF=(()=>{try{return new Intl.DateTimeFormat('en-u-ca-hebrew',{day:'numeric',month:'long',timeZone:'UTC'})}catch{return null}})();
const YT=['1 Tishri','2 Tishri','10 Tishri','15 Tishri','22 Tishri','15 Nisan','21 Nisan','6 Sivan'];
function ilParts(ms){const p={};new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date(ms)).forEach(x=>p[x.type]=+x.value);return p}
function isRest(y,m,d){const dt=new Date(Date.UTC(y,m-1,d,12));if(dt.getUTCDay()===6)return 'שבת';if(HF){const s=HF.format(dt);if(YT.includes(s))return 'חג'}return ''}
function shabNow(){if(!D.set.shabbat)return null;const now=Date.now(),p=ilParts(now),ss=sunset(p.year,p.month,p.day),tp=ilParts(now+864e5);
 const todayR=isRest(p.year,p.month,p.day),tomR=isRest(tp.year,tp.month,tp.day);
 if(todayR&&now<ss+45*6e4)return{w:todayR,end:ss+45*6e4};
 if(tomR&&now>ss-40*6e4){let e=sunset(tp.year,tp.month,tp.day)+45*6e4;let q=ilParts(e+864e5);if(isRest(q.year,q.month,q.day))e=sunset(q.year,q.month,q.day)+45*6e4;return{w:tomR,end:e}}
 return null}

 E.innerHTML=`<div class="shc"><div class="candles"><i></i><i></i></div><h2>${s.w==='שבת'?'שבת שלום!':'חג שמח!'}</h2><p>מערכת הזמנת הספרים סגורה ${s.w==='שבת'?'בשבת':'בחג'}.<br>נשמח לראותכם ${s.w==='שבת'?'במוצאי שבת':'במוצאי החג'}, אחרי ${t}.</p></div>`;E.classList.add('on')}

const FDEF={fh:'Secular One',fb:'Rubik'};
function fontHref(fh,fb){return'https://fonts.googleapis.com/css2?'+[...new Set([fh,fb])].map(f=>'family='+f.replace(/ /g,'+')+(FONTS[f]&&FONTS[f][0]?':wght@'+FONTS[f][0]:'')).join('&')+'&display=swap'}
function theme(){let st=$('#bk-theme');if(!st){st=h('style',{id:'bk-theme'});document.head.append(st)}const t=D.theme||{};
 const fh=FONTS[t.fh]?t.fh:FDEF.fh,fb=FONTS[t.fb]?t.fb:FDEF.fb,fhw=FONTS[fh][0]?(t.fhw||'700'):'400';
 st.textContent=':root{'+['ink','sun','rose','leaf','cream'].map(k=>t[k]?'--'+k+':'+t[k]+';':'').join('')+`--fh:'${fh}',sans-serif;--fb:'${fb}',sans-serif;--fhw:${fhw}}`+(t.fs&&t.fs!=='md'?`body{font-size:${t.fs==='lg'?'18.5px':'16px'}}`:'');
 const l=$('#bk-fonts'),u=fontHref(fh,fb);if(l&&l.getAttribute('href')!==u)l.setAttribute('href',u)}
/* ---------- banners: top bar · bottom bar · side card · popup — image, button, countdown, schedule ---------- */
const BNR_C={navy:['#24305e','#fff','#f4a72c'],sun:['#f4a72c','#24305e','#24305e'],rose:['#e5735c','#fff','#24305e'],leaf:['#2f8f7b','#fff','#f4a72c'],cream:['#fff8ea','#24305e','#e5735c'],white:['#ffffff','#24305e','#24305e']};
const bKey=b=>'bk-bx-'+b.id+'-'+strHash(JSON.stringify(b));
const bGone=b=>{if(window.__BK_PV)return false;try{return b.once?!!localStorage.getItem(bKey(b)):!!sessionStorage.getItem(bKey(b))}catch{return false}};
const bHide=b=>{try{b.once?localStorage.setItem(bKey(b),'1'):sessionStorage.setItem(bKey(b),'1')}catch{}};
const bEnd=b=>b.timer&&b.until?new Date(b.until).getTime():0;
function bActive(b){if(!b||!b.on)return false;const t=today();if(b.from&&t<b.from)return false;if(b.to&&t>b.to)return false;const e=bEnd(b);if(e&&Date.now()>=e&&b.after!=='text')return false;return !bGone(b)}
const bSafe=u=>/^(https?:\/\/|tel:|mailto:)/i.test(String(u||'').trim())?String(u).trim():'';
function bTimer(b){const e=bEnd(b);if(!e)return'';return `<div class="bnr-tm" data-end="${e}" data-after="${esc(b.afterText||'')}"><span class="bnr-tl">${esc(b.tlabel||'נותרו')}</span><span class="bnr-cd"></span></div>`}
function bTick(){const now=Date.now();$$('.bnr-tm').forEach(el=>{const e=+el.dataset.end,cd=$('.bnr-cd',el);let s=Math.max(0,Math.floor((e-now)/1000));
 if(s<=0){const at=el.dataset.after;if(at){el.innerHTML='<span class="bnr-tl">'+esc(at)+'</span>'}else{const w=el.closest('.bnr');if(w)w.remove()}return}
 const d=Math.floor(s/86400);s%=86400;const hh=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=s%60;
 cd.innerHTML=(d?`<b>${d}</b><small>${d===1?'יום':'ימים'}</small>`:'')+`<b>${pad(hh)}</b><small>שעות</small><b>${pad(mm)}</b><small>דקות</small><b>${pad(ss)}</b><small>שניות</small>`})}
function bInner(b){const sb=bSafe(b.url),btn=b.btn?(b.act==='order'?`<button class="bnr-btn" data-a="start">${esc(b.btn)}</button>`:sb?`<a class="bnr-btn" href="${esc(sb)}" target="_blank" rel="noopener">${esc(b.btn)}</a>`:''):'';
 return `${b.img?`<img class="bnr-img" src="${esc(b.img)}" alt="" loading="lazy">`:''}<div class="bnr-tx">${b.title?`<div class="bnr-t">${fmt(b.title)}</div>`:''}${b.text?`<div class="bnr-s">${fmt(b.text)}</div>`:''}${bTimer(b)}</div>${btn}`}
function banners(){$$('.bnr').forEach(e=>e.remove());clearInterval(banners._t);$$('.bnr-pop-t').forEach(t=>{clearTimeout(+t.dataset.t);t.remove()});document.body.classList.remove('has-bbar');
 const L=(D.banners||[]).filter(bActive);if(!L.length)return;
 L.forEach(b=>{const c=BNR_C[b.color]||BNR_C.navy,st=`--bb:${c[0]};--bf:${c[1]};--ba:${c[2]}`,x=b.close!==false?`<button class="bnr-x" aria-label="סגירה">✕</button>`:'';
  const el=h('div',{class:'bnr bnr-'+(b.pos||'top')+(b.side==='left'?' bnr-l':''),style:st,role:b.pos==='popup'?'dialog':'region','aria-label':'הודעה'});
  if(b.pos==='popup'){el.innerHTML=`<div class="bnr-box">${x}${bInner(b)}${+b.auto>0?`<i class="bnr-bar" style="animation-duration:${+b.auto}s"></i>`:''}</div>`}
  else el.innerHTML=`<div class="bnr-in">${bInner(b)}</div>${x}`;
  const close=()=>{bHide(b);el.classList.add('out');setTimeout(()=>{el.remove();if(!$('.bnr-bottom'))document.body.classList.remove('has-bbar')},300)};
  el.addEventListener('click',e=>{if(e.target.closest('.bnr-x')||(b.pos==='popup'&&e.target===el))close();else if(e.target.closest('.bnr-btn'))close()});
  if(b.pos==='top')document.body.insertBefore(el,$('.top'));
  else if(b.pos==='popup'){const show=()=>{if(!document.body.contains(el)){document.body.append(el);requestAnimationFrame(()=>el.classList.add('in'));bTick();if(+b.auto>0)setTimeout(close,+b.auto*1000)}};
   const tm=h('i',{class:'bnr-pop-t',hidden:true});tm.dataset.t=setTimeout(show,window.__BK_PV?400:Math.max(0,+b.delay||0)*1000);document.body.append(tm);el.addEventListener('keydown',e=>{if(e.key==='Escape')close()})}
  else{document.body.append(el);requestAnimationFrame(()=>el.classList.add('in'));if(b.pos==='bottom')document.body.classList.add('has-bbar')}});
 bTick();banners._t=setInterval(bTick,1000)}
function shell(){theme();document.title=D.seo.title||D.brand;const md=$('meta[name=description]');if(md)md.setAttribute('content',D.seo.desc||'');
 $('#b-name').textContent=D.brand;$('#b-sub').textContent='הזמנת ספרים'+(D.set.year?' · '+D.set.year:'');
 $('#f-name').textContent=D.brand;$('#f-line').textContent=T().line||'';$('#f-copy').textContent='© '+D.brand;
 $('#f-con').innerHTML=(D.set.phone?`<a href="tel:${esc(ph(D.set.phone))}">📞 ${esc(D.set.phone)}</a>`:'')+(D.set.wa?`<a href="https://wa.me/972${esc(ph(D.set.wa).slice(1))}" target="_blank" rel="noopener">💬 וואטסאפ</a>`:'')+(D.set.email?`<a href="mailto:${esc(D.set.email)}">✉️ <bdi dir="ltr">${esc(D.set.email)}</bdi></a>`:'');
 $$('#steps li span').forEach((e,i)=>e.textContent=xr('st'+(i+1)));
 chatInit();banners();a11yApply();const ab=$('#a11yBtn');if(ab&&!ab._w){ab._w=1;ab.onclick=a11yPanel}}
shell();go('home',{nohist:true,instant:true});try{history.replaceState({v:'home'},'')}catch{}
/* dashboard live preview only: show any screen with sample data (inactive on the real site) */
if(window.__BK_PV)addEventListener('message',e=>{const v=e.data&&e.data.bkpv;if(!v||!V[v]||e.source!==parent)return;
 const g=D.grades.find(x=>D.books.some(b=>b.on!==false&&b.grades.includes(x)))||D.grades[0]||'';
 const k1={id:'pv1',name:'רחלי כהן',cls:g+'׳1',grade:g},k2={id:'pv2',name:'שרה כהן',cls:(D.grades[1]||g)+'׳2',grade:D.grades[1]||g};
 const L=D.books.filter(b=>bookFor(b,g));Object.assign(F,{kid:'pv1',sid:'',sel:new Set(L.slice(0,3).map(b=>b.id)),pay:(D.pay.find(p=>p.on)||{}).id||'',via:'wa',phone:'0500000001',payOnly:false,demo:'123456'});
 const o={books:[...F.sel],total:sumBooks([...F.sel]),pay:F.pay,status:'חדשה'};
 SES=v==='home'||v==='id'?null:{token:'',phone:'0500000001',kids:[k1,k2],orders:['done','thanks','family'].includes(v)?{pv1:o}:{}};
 go(v,{nohist:true,instant:true})});
shabCheck();setInterval(shabCheck,60000);


})();
